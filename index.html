<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>about:blank - Search Engine</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #fff;
            color: #222;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background: #f8f9fa;
            border-bottom: 1px solid #ddd;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .navbar-logo {
            font-size: 18px;
            font-weight: 600;
        }

        .navbar-buttons {
            display: flex;
            gap: 8px;
        }

        .navbar-btn {
            border: 1px solid #ddd;
            background: white;
            padding: 8px 14px;
            border-radius: 16px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }

        .navbar-btn:hover {
            background: #f0f0f0;
        }

        .main {
            width: 100%;
            min-height: calc(100vh - 56px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .search-home {
            text-align: center;
            max-width: 650px;
            width: 100%;
        }

        .search-home.hidden {
            display: none;
        }

        .search-logo {
            font-size: 64px;
            font-weight: 300;
            letter-spacing: -2px;
            margin-bottom: 30px;
        }

        .search-box {
            position: relative;
            margin-bottom: 24px;
        }

        .search-input {
            width: 100%;
            padding: 16px 20px;
            font-size: 16px;
            border: 1px solid #ddd;
            border-radius: 28px;
            outline: none;
            box-shadow: 0 1px 8px rgba(0, 0, 0, 0.08);
            transition: all 0.3s;
        }

        .search-input:focus {
            border-color: #4285f4;
            box-shadow: 0 2px 12px rgba(66, 133, 244, 0.18);
        }

        .search-btn {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            background: #4285f4;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 18px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: background 0.2s;
        }

        .search-btn:hover {
            background: #3367d6;
        }

        .quick-search {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
            gap: 10px;
            margin-top: 24px;
        }

        .quick-btn {
            background: #f3f3f3;
            border: 1px solid #e0e0e0;
            padding: 10px 12px;
            border-radius: 18px;
            cursor: pointer;
            font-size: 12px;
            color: #555;
            transition: all 0.2s;
        }

        .quick-btn:hover {
            background: #e0e0e0;
            border-color: #4285f4;
            color: #4285f4;
        }

        .results-panel {
            display: none;
            width: 100%;
            max-width: 900px;
            max-height: 80vh;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            background: white;
            overflow: hidden;
            flex-direction: column;
        }

        .results-panel.show {
            display: flex;
        }

        .results-header {
            padding: 14px 18px;
            border-bottom: 1px solid #e0e0e0;
            background: #fafafa;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .results-title {
            font-size: 13px;
            color: #666;
        }

        .results-close-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 20px;
            color: #999;
        }

        .results-content {
            flex: 1;
            overflow-y: auto;
        }

        .result-item {
            padding: 14px 18px;
            border-bottom: 1px solid #e8e8e8;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .result-item:hover {
            background: #f5f5f5;
        }

        .result-info {
            flex: 1;
            text-align: left;
            margin-right: 12px;
        }

        .result-title {
            font-size: 14px;
            color: #1a73e8;
            font-weight: 500;
            margin-bottom: 4px;
        }

        .result-url {
            font-size: 11px;
            color: #006621;
            margin-bottom: 4px;
        }

        .result-description {
            font-size: 12px;
            color: #545454;
            line-height: 1.4;
        }

        .result-actions {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }

        .result-btn {
            background: #f0f0f0;
            border: 1px solid #ddd;
            padding: 6px 12px;
            border-radius: 14px;
            cursor: pointer;
            font-size: 11px;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .result-btn:hover {
            background: #e0e0e0;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <div class="navbar">
        <div class="navbar-logo">about:blank</div>
        <div class="navbar-buttons">
            <button class="navbar-btn" onclick="openFullscreenSearch()">🌐 Open Fullscreen</button>
            <button class="navbar-btn" onclick="alert('Settings: Coming soon')">⚙️ Settings</button>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main">
        <!-- Search Home -->
        <div class="search-home" id="searchHome">
            <div class="search-logo">about:blank</div>
            
            <div class="search-box">
                <input 
                    id="searchInput" 
                    class="search-input" 
                    type="text" 
                    placeholder="Search the web..." 
                    autofocus
                />
                <button class="search-btn" onclick="performSearch()">Search</button>
            </div>

            <div class="quick-search">
                <button class="quick-btn" onclick="quickSearch('JavaScript')">JavaScript</button>
                <button class="quick-btn" onclick="quickSearch('Python')">Python</button>
                <button class="quick-btn" onclick="quickSearch('Web Design')">Web Design</button>
                <button class="quick-btn" onclick="quickSearch('React')">React</button>
                <button class="quick-btn" onclick="quickSearch('CSS')">CSS</button>
                <button class="quick-btn" onclick="quickSearch('GitHub')">GitHub</button>
            </div>
        </div>

        <!-- Results Panel -->
        <div class="results-panel" id="resultsPanel">
            <div class="results-header">
                <span class="results-title" id="resultsTitle">Results</span>
                <button class="results-close-btn" onclick="closeResults()">×</button>
            </div>
            <div class="results-content" id="resultsContent"></div>
        </div>
    </div>

    <script>
        var searchInput = document.getElementById('searchInput');
        var resultsPanel = document.getElementById('resultsPanel');
        var resultsTitle = document.getElementById('resultsTitle');
        var resultsContent = document.getElementById('resultsContent');
        var searchHome = document.getElementById('searchHome');

        // Search database
        var searchDatabase = {
            'javascript': [
                { title: 'JavaScript.info', url: 'https://javascript.info', desc: 'Complete JavaScript tutorial and reference' },
                { title: 'MDN - JavaScript', url: 'https://developer.mozilla.org/docs/Web/JavaScript', desc: 'Official Mozilla JavaScript documentation' },
                { title: 'JavaScript Algorithms', url: 'https://github.com/trekhleb/javascript-algorithms', desc: 'JavaScript algorithms and data structures' }
            ],
            'python': [
                { title: 'Python.org', url: 'https://www.python.org', desc: 'Official Python programming language site' },
                { title: 'Real Python', url: 'https://realpython.com', desc: 'Python tutorials, courses, and articles' },
                { title: 'Python Docs', url: 'https://docs.python.org', desc: 'Official Python documentation' }
            ],
            'web design': [
                { title: 'Web.dev', url: 'https://web.dev', desc: 'Google web development resources' },
                { title: 'CSS-Tricks', url: 'https://css-tricks.com', desc: 'Daily CSS tips, tricks, and articles' },
                { title: 'Dribbble', url: 'https://dribbble.com', desc: 'Design and creative inspiration' }
            ],
            'react': [
                { title: 'React Documentation', url: 'https://react.dev', desc: 'Official React library docs' },
                { title: 'React Router', url: 'https://reactrouter.com', desc: 'React client-side routing' },
                { title: 'Redux', url: 'https://redux.js.org', desc: 'Predictable state management' }
            ],
            'css': [
                { title: 'CSS Reference', url: 'https://developer.mozilla.org/docs/Web/CSS', desc: 'Complete CSS property reference' },
                { title: 'CSS Grid', url: 'https://css-tricks.com/snippets/css/complete-guide-grid/', desc: 'Complete guide to CSS Grid' },
                { title: 'Flexbox', url: 'https://css-tricks.com/snippets/css/a-guide-to-flexbox/', desc: 'Complete guide to Flexbox' }
            ],
            'github': [
                { title: 'GitHub', url: 'https://github.com', desc: 'Where the world builds software' },
                { title: 'GitHub Docs', url: 'https://docs.github.com', desc: 'GitHub documentation and guides' },
                { title: 'GitHub Copilot', url: 'https://github.com/features/copilot', desc: 'AI-assisted code writing' }
            ]
        };

        // Event listeners
        searchInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                performSearch();
            }
        });

        function performSearch() {
            var query = searchInput.value.trim();
            if (!query) return;
            displayResults(query);
        }

        function quickSearch(query) {
            searchInput.value = query;
            displayResults(query);
        }

        function displayResults(query) {
            var lowerQuery = query.toLowerCase();
            var results = searchDatabase[lowerQuery];

            if (!results) {
                results = [
                    { title: 'Search "' + query + '" on Google', url: 'https://www.google.com/search?q=' + encodeURIComponent(query), desc: 'Google search results for "' + query + '"' },
                    { title: 'Search "' + query + '" on GitHub', url: 'https://github.com/search?q=' + encodeURIComponent(query), desc: 'GitHub repositories and code for "' + query + '"' },
                    { title: 'Search "' + query + '" on Stack Overflow', url: 'https://stackoverflow.com/search?q=' + encodeURIComponent(query), desc: 'Q&A and discussions about "' + query + '"' }
                ];
            }

            resultsTitle.textContent = 'Results for "' + query + '"';
            var html = '';

            for (var i = 0; i < results.length; i++) {
                var r = results[i];
                html += '<div class="result-item">' +
                    '<div class="result-info">' +
                    '<div class="result-title">' + r.title + '</div>' +
                    '<div class="result-url">' + r.url + '</div>' +
                    '<div class="result-description">' + r.desc + '</div>' +
                    '</div>' +
                    '<div class="result-actions">' +
                    '<button class="result-btn" onclick="openInNewTab(\'' + r.url + '\')">Open</button>' +
                    '</div>' +
                    '</div>';
            }

            resultsContent.innerHTML = html;
            searchHome.classList.add('hidden');
            resultsPanel.classList.add('show');
        }

        function openInNewTab(url) {
            var win = window.open(url, '_blank');
            if (!win) {
                alert('Popup blocked. Please allow popups.');
            }
        }

        function closeResults() {
            searchHome.classList.remove('hidden');
            resultsPanel.classList.remove('show');
            resultsContent.innerHTML = '';
            searchInput.value = '';
            searchInput.focus();
        }

        function openFullscreenSearch() {
            var win = window.open('about:blank', '_blank');
            if (!win) {
                alert('Popup blocked. Please allow popups.');
                return;
            }

            var doc = win.document;
            doc.open();
            doc.write(
                '<!DOCTYPE html>' +

                '.search-input:focus { border-color: #4285f4; box-shadow: 0 2px 12px rgba(66,133,244,0.18); }' +
                '.search-btn { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background: #4285f4; color: white; border: none; padding: 10px 18px; border-radius: 18px; cursor: pointer; font-size: 13px; }' +
                '.search-btn:hover { background: #3367d6; }' +
                '.quick-search { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; margin-top: 24px; }' +
                '.quick-btn { background: #f3f3f3; border: 1px solid #e0e0e0; padding: 10px 12px; border-radius: 18px; cursor: pointer; font-size: 12px; color: #555; }' +
                '.quick-btn:hover { background: #e0e0e0; }' +
                '.results-panel { display: none; flex: 1; border: 1px solid #e0e0e0; border-radius: 8px; margin: 0 40px 40px 40px; background: white; overflow: hidden; flex-direction: column; }' +

                'function fsPerformSearch() { var q = document.getElementById("fsSearchInput").value.trim(); if (q) fsDisplayResults(q); }' +
                'function fsQuickSearch(q) { document.getElementById("fsSearchInput").value = q; fsDisplayResults(q); }' +

                '      "<button class=\\"result-btn\\" onclick=\\"window.open(\'' + r.url + '\', \'' +
                '_blank' +
                '\')\\">' +
                'Open' +
                '</button>" +' +

                '  }' +
                '  document.getElementById("fsResultsContent").innerHTML = html;' +
                '  document.getElementById("fsResultsHeader").textContent = "Results for \\"" + query + "\\"";' +

            doc.close();
            win.history.replaceState(null, '', 'about:blank');

    </script>
