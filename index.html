<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Engine</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 700px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 50px 40px;
            text-align: center;
        }

        .logo {
            font-size: 48px;
            font-weight: 700;
            color: #333;
            margin-bottom: 8px;
            letter-spacing: -1px;
        }

        .tagline {
            color: #666;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .search-form {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .search-box {
            flex: 1;
            display: flex;
            align-items: center;
            border: 2px solid #ddd;
            border-radius: 30px;
            padding: 0 20px;
            background: #f9f9f9;
            transition: all 0.3s;
        }

        .search-box:focus-within {
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }

        .search-box input {
            flex: 1;
            border: none;
            outline: none;
            background: transparent;
            padding: 14px 0;
            font-size: 16px;
            color: #333;
        }

        .search-box input::placeholder {
            color: #999;
        }

        .search-icon {
            color: #999;
            font-size: 18px;
        }

        .btn-search {
            background: #667eea;
            color: white;
            border: none;
            border-radius: 30px;
            padding: 14px 28px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-search:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .btn-search:active {
            transform: translateY(0);
        }

        .controls {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .engine-select {
            padding: 10px 16px;
            border: 1px solid #ddd;
            border-radius: 20px;
            background: white;
            color: #333;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .engine-select:hover {
            border-color: #667eea;
        }

        .engine-select:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn-blank {
            background: #f0f0f0;
            color: #333;
            border: 1px solid #ddd;
            padding: 10px 16px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-blank:hover {
            background: #e0e0e0;
            border-color: #333;
        }

        .suggestions {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
            margin-top: 30px;
        }

        .suggestion {
            padding: 10px 14px;
            background: #f5f5f5;
            border: 1px solid #e0e0e0;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            color: #555;
            transition: all 0.3s;
        }

        .suggestion:hover {
            background: #efefef;
            border-color: #667eea;
            color: #667eea;
        }

        .error {
            color: #d32f2f;
            font-size: 14px;
            margin-top: 12px;
            display: none;
        }

        .error.show {
            display: block;
        }

        .footer {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #eee;
            font-size: 12px;
            color: #999;
        }

        .footer a {
            color: #667eea;
            text-decoration: none;
            margin: 0 8px;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            .container {
                padding: 30px 20px;
            }

            .logo {
                font-size: 36px;
            }

            .search-form {
                flex-direction: column;
            }

            .btn-search {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🔍 SEARCH</div>
        <div class="tagline">Search the web instantly</div>

        <form id="searchForm">
            <div class="search-form">
                <div class="search-box">
                    <span class="search-icon">🔎</span>
                    <input 
                        id="query" 
                        type="text" 
                        placeholder="Enter search query..." 
                        autocomplete="off"
                        autofocus
                    />
                </div>
                <button type="submit" class="btn-search">Search</button>
            </div>

            <div class="controls">
                <select id="engine" class="engine-select">
                    <option value="google">Google</option>
                    <option value="duckduckgo">DuckDuckGo</option>
                    <option value="bing">Bing</option>
                    <option value="brave">Brave Search</option>
                    <option value="startpage">Startpage</option>
                </select>
                <button type="button" class="btn-blank" onclick="openBlankSearch()">📄 Open Blank</button>
                <button type="button" class="btn-blank" onclick="clearSearch()">Clear</button>
            </div>

            <div class="error" id="error"></div>
        </form>

        <div class="suggestions">
            <div class="suggestion" onclick="search('JavaScript tutorial')">JavaScript</div>
            <div class="suggestion" onclick="search('Python programming')">Python</div>
            <div class="suggestion" onclick="search('Web Design tips')">Web Design</div>
            <div class="suggestion" onclick="search('React.js')">React</div>
            <div class="suggestion" onclick="search('CSS Grid')">CSS</div>
            <div class="suggestion" onclick="search('Node.js')">Node.js</div>
        </div>

        <div class="footer">
            <p>Built for fast, clean searching</p>
            <a href="#" onclick="return false;">Privacy</a>
            <a href="#" onclick="return false;">Terms</a>
        </div>
    </div>

    <script>
        const searchEngines = {
            google: function(q) {
                return 'https://www.google.com/search?q=' + encodeURIComponent(q);
            },
            duckduckgo: function(q) {
                return 'https://duckduckgo.com/?q=' + encodeURIComponent(q);
            },
            bing: function(q) {
                return 'https://www.bing.com/search?q=' + encodeURIComponent(q);
            },
            brave: function(q) {
                return 'https://search.brave.com/search?q=' + encodeURIComponent(q);
            },
            startpage: function(q) {
                return 'https://www.startpage.com/sp/search?query=' + encodeURIComponent(q);
            }
        };

        const form = document.getElementById('searchForm');
        const queryInput = document.getElementById('query');
        const engineSelect = document.getElementById('engine');
        const errorDiv = document.getElementById('error');

        // Load saved engine preference
        const savedEngine = localStorage.getItem('lastSearchEngine');
        if (savedEngine && searchEngines[savedEngine]) {
            engineSelect.value = savedEngine;
        }

        // Save engine preference
        engineSelect.addEventListener('change', function() {
            localStorage.setItem('lastSearchEngine', this.value);
        });

        // Handle form submission
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            executeSearch();
        });

        function executeSearch() {
            const query = queryInput.value.trim();
            const engine = engineSelect.value;

            // Clear error
            errorDiv.classList.remove('show');
            errorDiv.textContent = '';

            // Validate
            if (!query) {
                errorDiv.textContent = 'Please enter a search query.';
                errorDiv.classList.add('show');
                queryInput.focus();
                return;
            }

            if (!searchEngines[engine]) {
                errorDiv.textContent = 'Invalid search engine.';
                errorDiv.classList.add('show');
                return;
            }

            try {
                const url = searchEngines[engine](query);
                const urlObj = new URL(url);

                // Safety check
                if (urlObj.protocol !== 'https:' && urlObj.protocol !== 'http:') {
                    throw new Error('Invalid protocol');
                }

                // Navigate
                window.location.replace(url);
            } catch (err) {
                console.error('Search error:', err);
                errorDiv.textContent = 'Search failed. Please try again.';
                errorDiv.classList.add('show');
            }
        }

        function search(term) {
            queryInput.value = term;
            executeSearch();
        }

        function clearSearch() {
            queryInput.value = '';
            errorDiv.classList.remove('show');
            queryInput.focus();
        }

        function openBlankSearch() {
            try {
                const win = window.open('about:blank', '_blank');
                if (!win) {
                    errorDiv.textContent = 'Popup blocked. Please allow popups in your browser.';
                    errorDiv.classList.add('show');
                    return;
                }

                const html = '<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Search</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:Arial,sans-serif;background:#fff;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}.box{width:100%;max-width:600px;text-align:center}.logo{font-size:48px;margin-bottom:20px}.search-form{display:flex;gap:10px;margin-bottom:20px}.search-box{flex:1;display:flex;align-items:center;border:2px solid #ddd;border-radius:30px;padding:0 20px}.search-box input{flex:1;border:none;outline:none;padding:14px 0;font-size:16px;background:transparent}.search-form button{background:#667eea;color:white;border:none;border-radius:30px;padding:14px 24px;cursor:pointer;font-weight:600}.search-form button:hover{background:#5568d3}.controls{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;justify-content:center}select,button.opt{padding:10px 16px;border:1px solid #ddd;border-radius:20px;background:white;cursor:pointer}.error{color:#d32f2f;font-size:14px;margin-top:10px;display:none}</style></head><body><div class="box"><div class="logo">🔍</div><form id="f"><div class="search-form"><div class="search-box"><input id="q" type="text" placeholder="Search..." autofocus></div><button type="submit">Search</button></div><div class="controls"><select id="e"><option value="google">Google</option><option value="duckduckgo">DuckDuckGo</option><option value="bing">Bing</option><option value="brave">Brave</option></select><button type="button" class="opt" onclick="window.close()">Close</button></div><div class="error" id="err"></div></form></div><script>const eng={google:q=>"https://www.google.com/search?q="+encodeURIComponent(q),duckduckgo:q=>"https://duckduckgo.com/?q="+encodeURIComponent(q),bing:q=>"https://www.bing.com/search?q="+encodeURIComponent(q),brave:q=>"https://search.brave.com/search?q="+encodeURIComponent(q)};const f=document.getElementById("f");const q=document.getElementById("q");const e=document.getElementById("e");const err=document.getElementById("err");const s=localStorage.getItem("blankEngine");if(s&&eng[s])e.value=s;e.addEventListener("change",()=>{localStorage.setItem("blankEngine",e.value)});f.addEventListener("submit",t=>{t.preventDefault();const n=q.value.trim();if(!n){err.textContent="Enter a search term";err.style.display="block";return}const u=eng[e.value](n);try{window.location.replace(u)}catch(r){err.textContent="Search failed";err.style.display="block"}})<\/script></body></html>';

                win.document.write(html);
                win.document.close();
                win.history.replaceState(null, '', 'about:blank');
            } catch (err) {
                errorDiv.textContent = 'Error opening blank page: ' + err.message;
                errorDiv.classList.add('show');
            }
        }

        // Focus on load
        queryInput.focus();
    </script>
</body>
</html>
